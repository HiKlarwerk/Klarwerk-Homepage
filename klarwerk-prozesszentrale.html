    </div>
    <div class="project-task-overview__result-count" role="status" aria-live="polite">${visibleTasks.length} von ${stats.total} Projektaufgaben angezeigt</div>
    ${visibleTasks.length ? `<div class="project-task-overview__list">
      ${visibleTasks.map(({project,task})=>`
        <button type="button" class="project-task-overview__row" onclick="go('projekte',{projectId:'${project.id}', view:'Aufgaben'})" aria-label="${task.t}, Projekt ${project.name}, Aufgaben öffnen">
          <span class="project-task-overview__task">${task.t}</span>
          <span class="project-task-overview__project">${project.name}</span>
          <span class="project-task-overview__assignee">Verantwortlich: ${task.verantwortlich}</span>

        </button>`).join('')}

  `;
}

  return `
    <div class="card">
      <table class="data-table">

        <tbody>
          ${projects.map(project => `
            <tr>
              <td><button type="button" class="project-table__link" onclick="go('projekte',{projectId:'${project.id}', view:'Übersicht'})">${project.name}</button></td>
              <td>${project.kunde}</td>
              <td>${statusChip(project.status)}</td>
              <td style="width:140px">
                <div class="progress"><div class="progress__fill" style="width:${project.fortschritt}%"></div></div>
              </td>

              <td>${project.termin}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function updateProjectOverview({focusId,focusSelector,caretToEnd=false}={}){
  const workspace = document.getElementById('workspace');
  if(!workspace || state.area !== 'projekte' || state.projectId) return;
  workspace.innerHTML = viewProjekteListe();
  bindProjectOverviewControls();
  const focusTarget = focusId
    ? document.getElementById(focusId)
    : focusSelector ? document.querySelector(focusSelector) : null;
  if(focusTarget){
    focusTarget.focus({preventScroll:true});
    if(caretToEnd && typeof focusTarget.setSelectionRange === 'function'){
      const end = focusTarget.value.length;
      focusTarget.setSelectionRange(end,end);
    }
  }
}

function updateProjectOverviewSearch(value){
  projectOverviewState.searchQuery = value;
  updateProjectOverview({focusId:'projectOverviewSearch',caretToEnd:true});
}

function updateProjectOverviewStatus(value){
  projectOverviewState.statusFilter = value;
  updateProjectOverview({focusId:'projectOverviewStatus'});
}

function setProjectOverviewViewMode(mode){
  projectOverviewState.viewMode = mode;
  updateProjectOverview({focusSelector:`[data-project-overview-view="${mode}"]`});
}

function resetProjectOverviewFilters(){
  projectOverviewState.searchQuery = '';
  projectOverviewState.statusFilter = 'all';
  updateProjectOverview({focusId:'projectOverviewSearch',caretToEnd:true});
}

function resetProjectTaskFilters(){
  projectOverviewState.taskSearchQuery = '';
  projectOverviewState.taskStatusFilter = 'open';
  projectOverviewState.taskPriorityFilter = 'all';
  updateProjectOverview({focusId:'projectTaskSearch',caretToEnd:true});
}

function bindProjectOverviewControls(){
  const taskSearchInput = document.getElementById('projectTaskSearch');
  if(taskSearchInput){
    taskSearchInput.value = projectOverviewState.taskSearchQuery;
    taskSearchInput.oninput = event=>{
      projectOverviewState.taskSearchQuery = event.target.value;
      updateProjectOverview({focusId:'projectTaskSearch',caretToEnd:true});
    };
  }
  const taskStatusSelect = document.getElementById('projectTaskStatus');
  if(taskStatusSelect) taskStatusSelect.onchange = event=>{
    projectOverviewState.taskStatusFilter = event.target.value;
    updateProjectOverview({focusId:'projectTaskStatus'});
  };
  const taskPrioritySelect = document.getElementById('projectTaskPriority');
  if(taskPrioritySelect) taskPrioritySelect.onchange = event=>{
    projectOverviewState.taskPriorityFilter = event.target.value;
    updateProjectOverview({focusId:'projectTaskPriority'});
  };

  const searchInput = document.getElementById('projectOverviewSearch');
  if(searchInput){
    searchInput.value = projectOverviewState.searchQuery;
    searchInput.oninput = (event) => updateProjectOverviewSearch(event.target.value);
  }

  const statusSelect = document.getElementById('projectOverviewStatus');
  if(statusSelect){
    statusSelect.value = projectOverviewState.statusFilter;
    statusSelect.onchange = (event) => updateProjectOverviewStatus(event.target.value);
  }

  document.querySelectorAll('[data-project-overview-view]').forEach(button => {
    const isActive = button.getAttribute('data-project-overview-view') === projectOverviewState.viewMode;
    button.classList.toggle('active', isActive);
    button.setAttribute('aria-pressed', String(isActive));
    button.onclick = () => setProjectOverviewViewMode(button.getAttribute('data-project-overview-view'));
  });
}

function viewProjekteListe(){
  const visibleProjects = getVisibleProjects();
  const showingProjects = projectOverviewState.section === 'projects';
  return `
    <div class="ws-header">
      <div><div class="ws-title">Projekte ${runtime.source==='server'?'<span class="source-badge">● Firmenserver</span>':''}</div><div class="ws-subtitle">${showingProjects ? `${DATA.projekte.length} Projekte` : 'Projektübergreifende Aufgabenübersicht'}</div></div>
      ${showingProjects ? '<button type="button" class="btn btn--primary" onclick="showDemoUnavailable()">+ Neues Projekt</button>' : ''}
    </div>
    ${renderProjectOverviewSectionSwitch()}
    ${showingProjects ? `${renderProjectOverviewToolbar()}
    ${visibleProjects.length ? (
      projectOverviewState.viewMode === 'table'
        ? renderProjectTable(visibleProjects)
        : `<div class="project-grid">${visibleProjects.map(renderProjectCard).join('')}</div>`
    ) : `<div class="project-overview__empty"><div>Keine Projekte gefunden.</div><button class="btn btn--secondary" type="button" onclick="resetProjectOverviewFilters()">Filter zurücksetzen</button></div>`}` : renderProjectTaskOverview()}
  `;
}

   VIEW: PROJEKT-WORKSPACE — Dokument 201 Kap. 12–20
   ============================================================ */
function viewProjektWorkspace(){
  const p = DATA.projekte.find(x=>x.id===state.projectId);
  if(!p) return '<div class="empty">Projekt nicht gefunden.</div>';
  if(!state.view) state.view = 'Übersicht';
  return `
    <div class="ws-header">
      <div>
        <div class="ws-title">${p.name}</div>
        <div class="ws-subtitle">${p.kunde} · Verantwortlich: ${p.verantwortlich}</div>
      </div>
      ${statusChip(p.status)}
    </div>
    <div class="tabs">
      ${PROJECT_VIEWS.map(v=>`<button type="button" class="tab ${state.view===v?'active':''}" ${state.view===v?'aria-current="page"':''} onclick="go('projekte',{projectId:'${p.id}', view:'${v}'})">${getVisibleViewLabel(v)}</button>`).join('')}
    </div>
    <div id="tab-content">${renderProjectTab(p)}</div>
  `;
}

function getWorkOverviewStats(items,criticalPredicate){
  const total = items.length;
  const done = items.filter(item=>item.done).length;
  const critical = criticalPredicate ? items.filter(criticalPredicate).length : 0;
  return {total,done,open:total-done,critical,progress:total ? done / total * 100 : 0};
}

function findEmployeeByName(name){
  return DATA.mitarbeiter.find(employee=>employee.name === name) || null;
}

function getProjectTeamResources(project){
  const planningEntries = getPlanningEntriesForDate();
  return project.team.map(teamMember=>{
    const employee = findEmployeeByName(teamMember.name);
    if(!employee) return {teamMember,employee:null,projectPlanning:null,otherPlanning:null};
    const employeePlanning = planningEntries.filter(entry=>entry.resourceId === employee.id);
    return {
      teamMember,
      employee,
      projectPlanning:employeePlanning.find(entry=>entry.objectType === 'projekt' && entry.objectId === project.id) || null,
      otherPlanning:employeePlanning.find(entry=>entry.objectType !== 'projekt' || entry.objectId !== project.id) || null
    };
  });
}

function renderProjectTab(p){
  switch(state.view){
    case 'Übersicht': {
      const openTasks = p.aufgaben.filter(task=>!task.done);
      const criticalTaskCount = openTasks.filter(task=>task.prio === 'A').length;
      const projectPlanningEntries = getPlanningEntriesForObject('projekt',p.id);
      const projectHints = [];
      if(criticalTaskCount) projectHints.push({tone:'critical',text:`Kritische Aufgaben offen: ${criticalTaskCount}`});
      if(p.material.some(item=>item.status === 'Anfrage offen')) projectHints.push({tone:'amber',text:'Materialanfrage offen'});
      if(!p.termin || p.termin === '—') projectHints.push({tone:'neutral',text:'Kein Projekttermin hinterlegt'});
      if(!projectHints.length) projectHints.push({tone:'neutral',text:'Keine auffälligen Punkte in den vorhandenen Projektdaten.'});
      return `
        <div class="grid grid-2 object-overview__grid">
          <section class="card" aria-labelledby="projectOverviewStatusTitle">
            <h2 id="projectOverviewStatusTitle" class="card__title object-overview__section-title">Status</h2>
            <div class="object-overview__metrics">
              <div class="object-overview__metric"><span class="object-overview__metric-label">Status</span><span class="object-overview__metric-value">${statusChip(p.status)}</span></div>
              <div class="object-overview__metric"><span class="object-overview__metric-label">Fortschritt</span><span class="object-overview__metric-value">${p.fortschritt} %</span></div>
              <div class="object-overview__metric"><span class="object-overview__metric-label">Offen</span><span class="object-overview__metric-value">${openTasks.length} Aufgaben</span></div>
              <div class="object-overview__metric"><span class="object-overview__metric-label">Kritisch</span><span class="object-overview__metric-value">${criticalTaskCount}</span></div>
            </div>
            <div class="progress object-overview__progress" aria-label="Projektfortschritt ${p.fortschritt} Prozent"><div class="progress__fill" style="width:${p.fortschritt}%"></div></div>
          </section>
          <section class="card" aria-labelledby="projectOverviewPlanningTitle">
            <h2 id="projectOverviewPlanningTitle" class="card__title object-overview__section-title">Einsatz am Referenzdatum</h2>
            <div class="calendar-overview__context"><span>${CALENDAR_REFERENCE_LABEL}</span><span>·</span><span>${CALENDAR_TIME_ZONE}</span></div>
            <div class="list">
              ${projectPlanningEntries.map(entry=>{
                const resource = resolvePlanningResource(entry);
                const planningStatus = getCalendarPlanningStatus(entry);
                return `<article class="list-item object-planning-row"><div class="list-item__main"><div class="list-item__title">${resource?.name || 'Mitarbeiter nicht gefunden'}</div><div class="list-item__meta">${resource?.rolle || 'Planungsreferenz nicht gefunden'} · <time datetime="${entry.startAt}">${formatPlanningTime(entry.startAt)}</time> – <time datetime="${entry.endAt}">${formatPlanningTime(entry.endAt)}</time></div></div><span class="calendar-overview__status calendar-overview__status--${planningStatus.className}">${planningStatus.label}</span></article>`;
              }).join('') || '<div class="empty">Für dieses Projekt sind am Referenzdatum keine Einsätze geplant.</div>'}
            </div>
            <div class="object-overview__reference"><span>Projekttermin</span><strong>${p.termin || '—'}</strong></div>
          </section>
          <section class="card" aria-labelledby="projectOverviewHintsTitle">
            <h2 id="projectOverviewHintsTitle" class="card__title object-overview__section-title">Operative Hinweise</h2>
            <div class="object-overview__notices">${projectHints.map(hint=>`<span class="hint hint--${hint.tone}">${hint.text}</span>`).join('')}</div>
          </section>
          <section class="card" aria-labelledby="projectOverviewActionsTitle">
            <h2 id="projectOverviewActionsTitle" class="card__title object-overview__section-title">Direkt öffnen</h2>
            <div class="object-overview__actions">
              <button type="button" class="btn btn--secondary btn--s" onclick="go('projekte',{projectId:'${p.id}',view:'Aufgaben'})">Aufgaben öffnen</button>
              <button type="button" class="btn btn--secondary btn--s" onclick="go('projekte',{projectId:'${p.id}',view:'Kalender'})">Kalender öffnen</button>
              <button type="button" class="btn btn--secondary btn--s" onclick="go('projekte',{projectId:'${p.id}',view:'Dokumente'})">Dokumente öffnen</button>
              <button type="button" class="btn btn--secondary btn--s" onclick="go('projekte',{projectId:'${p.id}',view:'Material'})">Material öffnen</button>
            </div>
          </section>
        </div>`;
    }

    case 'Aufgaben': {
      const stats = getWorkOverviewStats(p.aufgaben,task=>!task.done && task.prio === 'A');
      const priorityRank = {A:0,B:1,C:2};
      const openTasks = p.aufgaben
        .filter(task=>!task.done)
        .sort((a,b)=>(priorityRank[a.prio] ?? 3) - (priorityRank[b.prio] ?? 3));
      const doneTasks = p.aufgaben.filter(task=>task.done);
      const renderTask = task=>`
        <div class="list-item work-overview__item">
          <div class="list-item__main work-overview__item-content">
            <div class="list-item__title">${task.t}</div>
            <div class="work-overview__item-details">
              <span class="work-overview__assignee">Verantwortlich: ${task.verantwortlich || 'Nicht zugeordnet'}</span>
              <span class="chip chip--${task.prio==='A'?'error':task.prio==='B'?'warning':'neutral'}">Priorität ${task.prio}</span>
              <span class="chip chip--${task.done?'success':'neutral'}">${task.done?'Erledigt':'Offen'}</span>
            </div>
          </div>
        </div>`;
      return `
        <section class="card" aria-labelledby="projectTasksTitle">
          <div class="card__header"><h2 class="card__title" id="projectTasksTitle">Aufgaben</h2><button type="button" class="btn btn--secondary btn--s" onclick="showDemoUnavailable()">+ Neue Aufgabe</button></div>
          <div class="work-overview__summary" aria-label="Aufgabenzusammenfassung">
            <div class="work-overview__metric"><span class="work-overview__metric-label">Gesamt</span><span class="work-overview__metric-value">${stats.total}</span></div>
            <div class="work-overview__metric"><span class="work-overview__metric-label">Offen</span><span class="work-overview__metric-value">${stats.open}</span></div>
            <div class="work-overview__metric"><span class="work-overview__metric-label">Erledigt</span><span class="work-overview__metric-value">${stats.done}</span></div>
            <div class="work-overview__metric"><span class="work-overview__metric-label">Kritisch</span><span class="work-overview__metric-value">${stats.critical}</span></div>
          </div>
          <div class="work-overview__progress">
            <div class="work-overview__progress-label"><span>Erledigt ${stats.done} von ${stats.total}</span><span>${Math.round(stats.progress)} %</span></div>
            <div class="progress" role="progressbar" aria-label="Projektaufgaben erledigt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(stats.progress)}"><div class="progress__fill" style="width:${stats.progress}%"></div></div>
          </div>
          ${stats.total ? `
            <section class="work-overview__section" aria-labelledby="projectTasksOpenTitle">
              <h3 class="work-overview__section-title" id="projectTasksOpenTitle">Offen (${stats.open})</h3>
              <div class="list">${openTasks.map(renderTask).join('') || '<div class="empty">Keine offenen Aufgaben.</div>'}</div>
            </section>
            <section class="work-overview__section work-overview__section--done" aria-labelledby="projectTasksDoneTitle">
              <h3 class="work-overview__section-title" id="projectTasksDoneTitle">Erledigt (${stats.done})</h3>
              <div class="list">${doneTasks.map(renderTask).join('') || '<div class="empty">Noch keine Aufgaben erledigt.</div>'}</div>
            </section>` :
            '<div class="empty">Für dieses Projekt sind noch keine Aufgaben vorhanden.<br><br><button type="button" class="btn btn--primary btn--s" onclick="showDemoUnavailable()">+ Neue Aufgabe erstellen</button></div>'}
        </section>`;
    }

    case 'Dokumente': return `
      <div class="grid project-documents-grid">
        <div class="card">
          <div class="card__header"><div class="card__title">Dokumente</div><button type="button" class="btn btn--secondary btn--s" onclick="showDemoUnavailable()">Hochladen</button></div>
          <div class="list">
            ${p.dokumente.map(d=>{
              const effectiveType = getDocumentEffectiveType(d);
              const typeLabel = effectiveType === '—' ? 'Datei' : effectiveType;
              const versionLabel = d.version && d.version !== '—'
                ? (/^v/i.test(String(d.version)) ? d.version : `v${d.version}`)
                : 'Version —';
              const sizeLabel = d.groesse && d.groesse !== '—' ? d.groesse : 'Größe —';
              const metadata = [typeLabel,versionLabel,sizeLabel];
              if(d.category && d.category !== '—') metadata.push(d.category);
              const content = `<div class="list-item__title">📄 ${d.name}</div>
                <div class="list-item__meta">${metadata.join(' · ')}</div>`;
              return `<div class="list-item"><div class="list-item__main">${
                d.openUrl
                  ? `<a class="document-link project-document-link" href="${d.openUrl}" target="_blank" rel="noopener">${content}</a>`
                  : content
              }</div></div>`;
            }).join('') || '<div class="empty">Keine Dokumente vorhanden.</div>'}
          </div>
        </div>
        <div class="card">
          <div class="card__title mb-m">Vorschau</div>
          <div class="empty">${p.dokumente.length ? 'Für die vorhandenen Dokumente ist keine Vorschauquelle hinterlegt.' : 'Kein Dokument ausgewählt.'}</div>
        </div>
      </div>`;

    case 'Material': {
      const stats = getMaterialOverviewStats(p.material);
      const procurementCount = stats.ordered + stats.requestOpen;
      const notices = [];
      if(stats.requestOpen) notices.push(`${stats.requestOpen} Materialanfrage${stats.requestOpen===1?'':'n'} offen`);
      if(stats.ordered) notices.push(`${stats.ordered} Position${stats.ordered===1?'':'en'} bestellt`);
      if(stats.reserved) notices.push(`${stats.reserved} Position${stats.reserved===1?'':'en'} reserviert`);
      if(stats.available === stats.total && stats.total) notices.push('Keine offenen Beschaffungsvorgänge.');
      const renderMaterialPosition = item=>`
        <li class="material-overview__row">
          <div class="material-overview__article">${item.artikel}</div>
          <div class="material-overview__field"><span class="material-overview__field-label">Menge</span><span class="material-overview__field-value">${item.menge}</span></div>
          <div class="material-overview__field"><span class="material-overview__field-label">Status</span>${materialStatusChip(item.status)}</div>
        </li>`;
      return `
        <section class="card" aria-labelledby="projectMaterialTitle">
          <div class="card__header"><h2 class="card__title" id="projectMaterialTitle">Material</h2><button type="button" class="btn btn--secondary btn--s" onclick="showDemoUnavailable()">Artikel hinzufügen</button></div>
          <div class="material-overview__summary" aria-label="Materialzusammenfassung">
            <div class="material-overview__metric"><span class="material-overview__metric-label">Gesamt</span><span class="material-overview__metric-value">${stats.total}</span></div>
            <div class="material-overview__metric"><span class="material-overview__metric-label">Verfügbar</span><span class="material-overview__metric-value">${stats.available}</span></div>
            <div class="material-overview__metric"><span class="material-overview__metric-label">In Beschaffung</span><span class="material-overview__metric-value">${procurementCount}</span></div>
            <div class="material-overview__metric"><span class="material-overview__metric-label">Reserviert</span><span class="material-overview__metric-value">${stats.reserved}</span></div>
          </div>
          ${stats.total ? `
            <section class="material-overview__context" aria-labelledby="projectProcurementTitle">
              <h3 class="material-overview__context-title" id="projectProcurementTitle">Beschaffungsstatus</h3>
              <div class="material-overview__notices">${notices.map(notice=>`<span class="material-overview__notice">${notice}</span>`).join('')}</div>
            </section>
            <section aria-labelledby="projectMaterialPositionsTitle">
              <h3 class="material-overview__positions-title" id="projectMaterialPositionsTitle">Materialpositionen</h3>
              <ul class="material-overview__list">${p.material.map(renderMaterialPosition).join('')}</ul>
            </section>` :
            '<div class="empty">Für dieses Projekt sind keine Materialpositionen erfasst.</div>'}
        </section>`;
    }

    case 'Kalender': {
      const projectPlanningEntries = getPlanningEntriesForObject('projekt',p.id);
      return `
        <div class="card">
          <div class="card__header">
            <div><div class="card__title">Projektbezogene Einsatzplanung</div><div class="calendar-overview__context"><span>${CALENDAR_REFERENCE_LABEL}</span><span>·</span><span>${CALENDAR_TIME_ZONE}</span></div></div>
          </div>
          <div class="list">
            ${projectPlanningEntries.map(entry=>{
              const resource = resolvePlanningResource(entry);
              const planningStatus = getCalendarPlanningStatus(entry);
              return `<article class="list-item object-planning-row">
                <div class="list-item__main">
                  <div class="list-item__title">${resource?.name || 'Mitarbeiter nicht gefunden'}</div>
                  <div class="list-item__meta">${resource?.rolle || 'Planungsreferenz nicht gefunden'} · <time datetime="${entry.startAt}">${formatPlanningTime(entry.startAt)}</time> – <time datetime="${entry.endAt}">${formatPlanningTime(entry.endAt)}</time></div>
                </div>
                <span class="calendar-overview__status calendar-overview__status--${planningStatus.className}">${planningStatus.label}</span>
              </article>`;
            }).join('') || '<div class="empty">Für dieses Projekt sind am Referenzdatum keine Einsätze geplant.</div>'}
          </div>
        </div>`;
    }

    case 'Team': {
      const resources = getProjectTeamResources(p);
      const internalResources = resources.filter(resource=>resource.employee);
      const externalResources = resources.filter(resource=>!resource.employee);
      const plannedForProject = internalResources.filter(resource=>resource.projectPlanning).length;
      const availabilityMap = {
        eingesetzt:{label:'Im Einsatz',className:'assigned'},
        verfuegbar:{label:'Verfügbar',className:'available'},
        abwesend:{label:'Abwesend',className:'absent'}
      };
      const renderInternalResource = resource=>{
        const {employee,projectPlanning,otherPlanning} = resource;
        const availability = availabilityMap[employee.verfuegbarkeit] || {label:'Status unbekannt',className:'absent'};
        const assignment = getEmployeeAssignment(employee);
        const movementStatus = employee.bewegungsstatus === 'unterwegs'
          ? '<span class="employee-overview__status employee-overview__status--travel">Unterwegs</span>'
          : '';
        let planningMarkup = '<span class="project-team__planning-label">Am Referenzdatum nicht eingeplant</span>';
        if(projectPlanning){
          const planningStatus = getCalendarPlanningStatus(projectPlanning);
          planningMarkup = `<span class="project-team__planning-head"><span class="project-team__planning-label project-team__planning-label--project">Im Projekt eingeplant</span><span class="calendar-overview__status calendar-overview__status--${planningStatus.className}">${planningStatus.label}</span></span>
            <span class="project-team__planning-meta"><time datetime="${projectPlanning.startAt}">${formatPlanningTime(projectPlanning.startAt)}</time> – <time datetime="${projectPlanning.endAt}">${formatPlanningTime(projectPlanning.endAt)}</time></span>`;
        } else if(otherPlanning){
          const planningObject = resolvePlanningObject(otherPlanning);
          const planningStatus = getCalendarPlanningStatus(otherPlanning);
          const objectLabel = planningObject ? `${planningObject.label} ${planningObject.title}` : 'Planungsobjekt nicht gefunden';
          planningMarkup = `<span class="project-team__planning-head"><span class="project-team__planning-label project-team__planning-label--other">Anderweitig eingeplant · ${objectLabel}</span><span class="calendar-overview__status calendar-overview__status--${planningStatus.className}">${planningStatus.label}</span></span>
            <span class="project-team__planning-meta"><time datetime="${otherPlanning.startAt}">${formatPlanningTime(otherPlanning.startAt)}</time> – <time datetime="${otherPlanning.endAt}">${formatPlanningTime(otherPlanning.endAt)}</time></span>`;
        }
        const assignmentMarkup = assignment && !assignment.missing
          ? `Aktuelle Zuordnung: ${assignment.label} · ${assignment.title}`
          : assignment?.missing ? 'Aktuelle Zuordnung nicht gefunden' : 'Keine aktuelle Zuordnung';
        return `<button type="button" class="project-team__resource" onclick="go('mitarbeiter',{employeeId:'${employee.id}'})" aria-label="Mitarbeiter ${employee.name} öffnen">
          <span class="project-team__identity"><span class="project-team__avatar" aria-hidden="true">${getEmployeeInitials(employee.name)}</span><span class="project-team__person"><span class="project-team__name">${employee.name}</span><span class="project-team__role">${employee.rolle}</span></span></span>
          <span class="project-team__statuses"><span class="chip chip--info">Intern</span><span class="employee-overview__status employee-overview__status--${availability.className}">${availability.label}</span>${movementStatus}</span>
          <span class="project-team__planning"><span class="project-team__eyebrow">Planung am Referenzdatum</span>${planningMarkup}<span class="project-team__assignment">${assignmentMarkup}</span></span>
          <span class="project-team__open">Mitarbeiter öffnen →</span>
        </button>`;
      };
      const renderExternalResource = resource=>`
        <article class="project-team__resource project-team__resource--external">
          <div class="project-team__identity"><span class="project-team__avatar" aria-hidden="true">${getEmployeeInitials(resource.teamMember.name)}</span><span class="project-team__person"><span class="project-team__name">${resource.teamMember.name}</span><span class="project-team__role">${resource.teamMember.rolle || 'Rolle nicht hinterlegt'}</span></span></div>
          <div class="project-team__statuses"><span class="chip chip--neutral">Extern</span></div>
        </article>`;
      return `
        <section class="card" aria-labelledby="projectTeamTitle">
          <h2 class="card__title mb-m" id="projectTeamTitle">Projektteam</h2>
          <div class="project-team__summary" aria-label="Teamzusammenfassung">
            <div class="project-team__metric"><span class="project-team__metric-label">Team gesamt</span><span class="project-team__metric-value">${resources.length}</span></div>
            <div class="project-team__metric"><span class="project-team__metric-label">Intern</span><span class="project-team__metric-value">${internalResources.length}</span></div>
            <div class="project-team__metric"><span class="project-team__metric-label">Extern</span><span class="project-team__metric-value">${externalResources.length}</span></div>
            <div class="project-team__metric"><span class="project-team__metric-label">Im Projekt eingeplant</span><span class="project-team__metric-value">${plannedForProject}</span></div>
          </div>
          ${resources.length ? `
            <section class="project-team__section" aria-labelledby="projectTeamInternalTitle">
              <h3 class="project-team__section-title" id="projectTeamInternalTitle">Interne Ressourcen</h3>
              <div class="project-team__list">${internalResources.map(renderInternalResource).join('') || '<div class="empty">Keine internen Teamressourcen zugeordnet.</div>'}</div>
            </section>
            ${externalResources.length ? `<section class="project-team__section" aria-labelledby="projectTeamExternalTitle"><h3 class="project-team__section-title" id="projectTeamExternalTitle">Externe Ressourcen</h3><div class="project-team__list">${externalResources.map(renderExternalResource).join('')}</div></section>` : ''}` :
            '<div class="empty">Diesem Projekt sind keine Teamressourcen zugeordnet.</div>'}
        </section>`;
    }

    case 'Chat':
      return renderChat(p.chat,'projekte',p.id,'projectChatTitle');

    case 'Historie': return `
      <section class="card" aria-labelledby="projectHistoryTitle">
        <div class="card__header">
          <h2 class="card__title" id="projectHistoryTitle">Aktivitätsprotokoll</h2>
          <button type="button" class="btn btn--secondary btn--s" onclick="go('projekte',{projectId:'${p.id}',view:'Chat'})">Chat öffnen</button>
        </div>
        <p class="history-overview__scope-note">Dieses Protokoll zeigt ausschließlich Aktivitäten im Demonstrator. Es ist keine technische Objekt- oder Versionshistorie und bietet keine Wiederherstellung.</p>
        ${renderTimeline(p.historie)}
      </section>`;
  }
}

function getChatOverviewStats(messages){
  const entries = Array.isArray(messages) ? messages : [];
  const participants = new Set(entries.map(message=>typeof message.von === 'string' ? message.von.trim() : '').filter(Boolean));
  return {
    messageCount:entries.length,
    participantCount:participants.size,
    lastMessage:entries.length ? entries[entries.length-1] : null
  };
}

function renderChat(messages,area,objectId,titleId){
  const entries = Array.isArray(messages) ? messages : [];
  const stats = getChatOverviewStats(entries);
  const navigation = area === 'projekte'
    ? `go('projekte',{projectId:'${objectId}',view:'Historie'})`
    : `go('service',{serviceId:'${objectId}',view:'Historie'})`;
  const latest = stats.lastMessage;
  return `
    <section class="card chat" aria-labelledby="${titleId}">
      <div class="card__header">
        <h2 class="card__title" id="${titleId}">Chat</h2>
        <button type="button" class="btn btn--secondary btn--s" onclick="${navigation}">Aktivitäten öffnen</button>
      </div>
      <div class="communication-overview__summary" aria-label="Chat-Zusammenfassung">
        <div class="communication-overview__metric"><span class="communication-overview__metric-label">Nachrichten</span><span class="communication-overview__metric-value">${stats.messageCount}</span></div>
        <div class="communication-overview__metric"><span class="communication-overview__metric-label">Teilnehmer</span><span class="communication-overview__metric-value">${stats.participantCount}</span></div>
        <div class="communication-overview__metric">
          <span class="communication-overview__metric-label">Letzte Nachricht</span>
          <span class="communication-overview__metric-value">${latest?.von || '—'}</span>
          ${latest ? `<span class="communication-overview__metric-detail">${latest.zeit || '—'}</span>` : ''}
        </div>
      </div>
      ${entries.length ? `
        <ol class="chat__messages" aria-label="Nachrichtenverlauf">
          ${entries.map(message=>`
            <li class="msg ${message.self?'self':''}">
              <span class="msg__avatar" aria-hidden="true">${getEmployeeInitials(message.von || '')}</span>
              <article class="msg__content">
                <div class="msg__meta"><strong>${message.von}</strong><span aria-hidden="true">·</span><span>${message.zeit}</span></div>
                <div class="msg__bubble">${message.text}</div>
              </article>
            </li>`).join('')}
        </ol>` :
        '<div class="empty chat__empty">Für dieses Objekt sind noch keine Nachrichten vorhanden.</div>'}
      <div class="chat__composer">
        <div class="chat__input">
          <label class="sr-only" for="${titleId}Input">Nachricht schreiben</label>
          <input id="${titleId}Input" type="text" placeholder="Nachricht schreiben …">
          <button type="button" class="btn btn--primary btn--s" onclick="showDemoUnavailable()">Senden</button>
        </div>
        <p class="chat__demo-note">Nachrichtenversand ist im Demonstrator nicht aktiv.</p>
      </div>
    </section>`;
}

function getHistoryOverviewStats(days){
  const populatedDays = (Array.isArray(days) ? days : []).filter(day=>Array.isArray(day.eintraege) && day.eintraege.length);
  return {
    dayCount:populatedDays.length,
    entryCount:populatedDays.reduce((total,day)=>total+day.eintraege.length,0),
    highlightedEntry:populatedDays.length ? populatedDays[0].eintraege[0] : null
  };
}

function renderTimeline(days){
  const populatedDays = (Array.isArray(days) ? days : []).filter(day=>Array.isArray(day.eintraege) && day.eintraege.length);
  const stats = getHistoryOverviewStats(populatedDays);
  if(!stats.entryCount) return `
    <div class="history-overview__summary" aria-label="Zusammenfassung des Aktivitätsprotokolls">
      <div class="history-overview__metric"><span class="history-overview__metric-label">Aktivitäten</span><span class="history-overview__metric-value">0</span></div>
      <div class="history-overview__metric"><span class="history-overview__metric-label">Tagesblöcke</span><span class="history-overview__metric-value">0</span></div>
    </div>
    <div class="empty">Für dieses Objekt sind noch keine Aktivitäten protokolliert.</div>`;
  return `
    <div class="history-overview__summary" aria-label="Zusammenfassung des Aktivitätsprotokolls">
      <div class="history-overview__metric"><span class="history-overview__metric-label">Aktivitäten</span><span class="history-overview__metric-value">${stats.entryCount}</span></div>
      <div class="history-overview__metric"><span class="history-overview__metric-label">Tagesblöcke</span><span class="history-overview__metric-value">${stats.dayCount}</span></div>
    </div>
    <section class="history-overview__highlighted" aria-labelledby="historyHighlightedTitle">
      <h3 class="history-overview__highlighted-title" id="historyHighlightedTitle">Hervorgehobener Protokolleintrag</h3>
      <div class="history-overview__highlighted-entry"><span class="timeline__time">${stats.highlightedEntry.zeit}</span><span class="timeline__text">${stats.highlightedEntry.text}</span></div>
    </section>
    <section aria-labelledby="historyListTitle">
      <h3 class="history-overview__list-title" id="historyListTitle">Protokollierte Aktivitäten</h3>
      <div class="history-overview__days">
        ${populatedDays.map((day,index)=>`
          <section class="history-overview__day" aria-labelledby="historyDay${index}">
            <h4 class="timeline__day" id="historyDay${index}">${day.tag} · ${day.eintraege.length} ${day.eintraege.length===1?'Aktivität':'Aktivitäten'}</h4>
            <ul class="timeline">
              ${day.eintraege.map(entry=>`<li class="timeline__entry"><span class="timeline__time">${entry.zeit}</span><span class="timeline__text">${entry.text}</span></li>`).join('')}
            </ul>
          </section>`).join('')}
      </div>
    </section>`;
}

function getVisibleServiceItems(){
  const q = serviceOverviewState.searchQuery.trim().toLocaleLowerCase('de');
  const status = serviceOverviewState.statusFilter;
  const technician = serviceOverviewState.technicianFilter;
  const onlyUnassigned = serviceOverviewState.onlyUnassigned;

  return DATA.service.filter(service => {
    const haystack = `${service.nr} ${service.titel} ${service.kunde} ${service.techniker}`.toLocaleLowerCase('de');
    const matchesQuery = !q || haystack.includes(q);
    const matchesStatus = status === 'all' || service.status === status;
    const matchesTechnician = onlyUnassigned
      ? (!service.techniker || service.techniker === '—')
      : technician === 'all' || (technician === 'unassigned' ? (!service.techniker || service.techniker === '—') : service.techniker === technician);
    return matchesQuery && matchesStatus && matchesTechnician;
  });
}

function getServicePriorityGroup(service){
  if(service.status === 'Abgeschlossen') return 'abgeschlossen';
  if(service.prioritaet === 'A') return 'a';
  if(service.prioritaet === 'B') return 'b';
  if(service.prioritaet === 'C') return 'c';
  return 'c';
}

function isServiceUnassigned(service){
  return !service.techniker || service.techniker === '—';
}

function getAllServiceChecklistItems(){
  return DATA.service.flatMap((service,serviceIndex)=>
    (service.checkliste || []).map((item,itemIndex)=>({service,item,serviceIndex,itemIndex}))
  );
}

function getServiceChecklistOverviewStats(){
  const checklistItems = getAllServiceChecklistItems();
  return {
    total:checklistItems.length,
    open:checklistItems.filter(({item})=>!item.done).length,
    done:checklistItems.filter(({item})=>item.done).length,
    priorityAOpen:checklistItems.filter(({service,item})=>!item.done && service.prioritaet === 'A').length
  };
}

function getVisibleServiceChecklistItems(){
  const q = serviceOverviewState.checklistSearchQuery.trim().toLocaleLowerCase('de');
  const status = serviceOverviewState.checklistStatusFilter;
  const priority = serviceOverviewState.checklistPriorityFilter;
  const priorityOrder = {A:0,B:1,C:2};
  return getAllServiceChecklistItems()
    .filter(({service,item})=>{
      const haystack = `${item.t} ${service.nr} ${service.titel} ${service.kunde} ${service.techniker}`.toLocaleLowerCase('de');
      const matchesQuery = !q || haystack.includes(q);
      const matchesStatus = status === 'all' || (status === 'open' ? !item.done : item.done);
      const matchesPriority = priority === 'all' || service.prioritaet === priority;
      return matchesQuery && matchesStatus && matchesPriority;
    })
    .sort((a,b)=>
      Number(a.item.done) - Number(b.item.done) ||
      (priorityOrder[a.service.prioritaet] ?? 3) - (priorityOrder[b.service.prioritaet] ?? 3) ||
      a.serviceIndex - b.serviceIndex ||
      a.itemIndex - b.itemIndex
    );
}

function setServiceOverviewSection(section){
  if(!['orders','checklist'].includes(section)) return;
  serviceOverviewState.section = section;
  updateServiceOverview({focusSelector:`[data-service-overview-section="${section}"]`});
}

          <span class="service-checklist-overview__item">${item.t}</span>

function renderServiceOverviewItem(service){
  const group = getServicePriorityGroup(service);
  const unassigned = isServiceUnassigned(service);
  let dispatchKind = 'neutral';
  let dispatchText = '';
  if(service.status === 'Abgeschlossen'){
    dispatchKind = 'completed';
    dispatchText = 'Abgeschlossen';
  } else if(group === 'a' && unassigned){
    dispatchKind = 'critical';
    dispatchText = 'Techniker zuweisen';
  } else if((group === 'b' || group === 'c') && unassigned){
    dispatchKind = 'warning';
    dispatchText = 'Techniker zuweisen';
  } else if(unassigned){
    dispatchKind = 'warning';
    dispatchText = 'Techniker zuweisen';
  }

  return `
    <button type="button" class="service-overview__item" onclick="go('service',{serviceId:'${service.id}', view:'Übersicht'})">
      <div class="service-overview__item-top">
        <div class="service-overview__item-title">${service.nr} · ${service.titel}</div>
        <span class="service-overview__item-badge service-overview__item-badge--${service.status === 'Abgeschlossen' ? 'completed' : group}">${service.status === 'Abgeschlossen' ? 'Abgeschlossen' : group.toUpperCase()}</span>
      </div>
      <div class="service-overview__item-meta">
        <span>${service.kunde}</span>
        <span>Termin: ${service.termin}</span>
        <span>Techniker: ${service.techniker || '—'}</span>
        <span>Status: ${service.status}</span>
      </div>
      ${dispatchText ? `<div class="service-overview__item-dispatch service-overview__item-dispatch--${dispatchKind}">${dispatchText}</div>` : ''}
    </button>
  `;
}

function renderServicePriorityGroup(group){
  const groupConfig = {
    a:{title:'A – Sofort / Notfall', copy:'Sofortige Bearbeitung und Disposition', className:'service-overview__group--a'},
    b:{title:'B – Heute', copy:'Heute anstehende Einsätze', className:'service-overview__group--b'},
    c:{title:'C – Diese Woche', copy:'Geplante Einsätze dieser Woche', className:'service-overview__group--c'},
    abgeschlossen:{title:'Abgeschlossen', copy:'Bereits erledigte Aufträge', className:'service-overview__group--completed'}
  };
  const items = getVisibleServiceItems().filter(item => getServicePriorityGroup(item) === group);
  if(!items.length) return '';
  const config = groupConfig[group];
  return `
    <details class="service-overview__group ${config.className}" ${group === 'abgeschlossen' ? '' : 'open'}>
      <summary class="service-overview__group-summary">
        <div>
          <div class="service-overview__group-title">${config.title}</div>
          <div class="service-overview__group-copy">${config.copy}</div>
        </div>
        <span class="service-overview__group-count">${items.length}</span>
      </summary>
      <div class="service-overview__group-body">
        ${items.map(renderServiceOverviewItem).join('')}
      </div>
    </details>
  `;
}

function updateServiceOverview({focusId,focusSelector,caretToEnd=false}={}){
  const workspace = document.getElementById('workspace');
  if(!workspace || state.area !== 'service' || state.serviceId) return;
  workspace.innerHTML = viewServiceListe();
  bindServiceOverviewControls();
  const focusTarget = focusId
    ? document.getElementById(focusId)
    : focusSelector ? document.querySelector(focusSelector) : null;
  if(focusTarget){
    focusTarget.focus({preventScroll:true});
    if(caretToEnd && typeof focusTarget.setSelectionRange === 'function'){
      const end = focusTarget.value.length;
      focusTarget.setSelectionRange(end,end);
    }
  }
}

function updateServiceOverviewSearch(value){
  serviceOverviewState.searchQuery = value;
  updateServiceOverview({focusId:'serviceOverviewSearch',caretToEnd:true});
}

function updateServiceOverviewStatus(value){
  serviceOverviewState.statusFilter = value;
  updateServiceOverview({focusId:'serviceOverviewStatus'});
}

function updateServiceOverviewTechnician(value){
  serviceOverviewState.technicianFilter = value;
  serviceOverviewState.onlyUnassigned = value === 'unassigned';
  updateServiceOverview({focusId:'serviceOverviewTechnician'});
}

function toggleServiceOverviewOnlyUnassigned(){
  serviceOverviewState.onlyUnassigned = !serviceOverviewState.onlyUnassigned;
  if(serviceOverviewState.onlyUnassigned){
    serviceOverviewState.technicianFilter = 'unassigned';
  } else if(serviceOverviewState.technicianFilter === 'unassigned'){
    serviceOverviewState.technicianFilter = 'all';
  }
  updateServiceOverview({focusId:'serviceOverviewOnlyUnassigned'});
}

function resetServiceOverviewFilters(){
  serviceOverviewState.searchQuery = '';
  serviceOverviewState.statusFilter = 'all';
  serviceOverviewState.technicianFilter = 'all';
  serviceOverviewState.onlyUnassigned = false;
  updateServiceOverview({focusId:'serviceOverviewSearch',caretToEnd:true});
}

function resetServiceChecklistFilters(){
  serviceOverviewState.checklistSearchQuery = '';
  serviceOverviewState.checklistStatusFilter = 'open';
  serviceOverviewState.checklistPriorityFilter = 'all';
  updateServiceOverview({focusId:'serviceChecklistSearch',caretToEnd:true});
}

function bindServiceOverviewControls(){
  const checklistSearchInput = document.getElementById('serviceChecklistSearch');
  if(checklistSearchInput){
    checklistSearchInput.value = serviceOverviewState.checklistSearchQuery;
    checklistSearchInput.oninput = event=>{
      serviceOverviewState.checklistSearchQuery = event.target.value;
      updateServiceOverview({focusId:'serviceChecklistSearch',caretToEnd:true});
    };
  }

  const checklistStatusSelect = document.getElementById('serviceChecklistStatus');
  if(checklistStatusSelect) checklistStatusSelect.onchange = event=>{
    serviceOverviewState.checklistStatusFilter = event.target.value;
    updateServiceOverview({focusId:'serviceChecklistStatus'});
  };

  const checklistPrioritySelect = document.getElementById('serviceChecklistPriority');
  if(checklistPrioritySelect) checklistPrioritySelect.onchange = event=>{
    serviceOverviewState.checklistPriorityFilter = event.target.value;
    updateServiceOverview({focusId:'serviceChecklistPriority'});
  };

  const searchInput = document.getElementById('serviceOverviewSearch');
  if(searchInput){
    searchInput.value = serviceOverviewState.searchQuery;
    searchInput.oninput = (event) => updateServiceOverviewSearch(event.target.value);
  }

  const statusSelect = document.getElementById('serviceOverviewStatus');
  if(statusSelect){
    statusSelect.value = serviceOverviewState.statusFilter;
    statusSelect.onchange = (event) => updateServiceOverviewStatus(event.target.value);
  }

  const technicianSelect = document.getElementById('serviceOverviewTechnician');
  if(technicianSelect){
    technicianSelect.value = serviceOverviewState.technicianFilter;
    technicianSelect.onchange = (event) => updateServiceOverviewTechnician(event.target.value);
  }

  const onlyUnassignedButton = document.getElementById('serviceOverviewOnlyUnassigned');
  if(onlyUnassignedButton){
    onlyUnassignedButton.classList.toggle('active', serviceOverviewState.onlyUnassigned);
    onlyUnassignedButton.setAttribute('aria-pressed', String(serviceOverviewState.onlyUnassigned));
    onlyUnassignedButton.onclick = () => toggleServiceOverviewOnlyUnassigned();
  }
}

function viewServiceListe(){
  const visibleItems = getVisibleServiceItems();
  const hasVisibleItems = visibleItems.length > 0;
  const showingOrders = serviceOverviewState.section === 'orders';
  return `
    <div class="ws-header">
      <div><div class="ws-title">Service</div><div class="ws-subtitle">${showingOrders ? `${DATA.service.length} Serviceaufträge` : 'Auftragsübergreifende Checklistenübersicht'}</div></div>
      ${showingOrders ? '<button type="button" class="btn btn--primary" onclick="showDemoUnavailable()">+ Neuer Serviceauftrag</button>' : ''}
    </div>
    ${renderServiceOverviewSectionSwitch()}
    ${showingOrders ? `${renderServiceOverviewToolbar()}
    ${hasVisibleItems ? [
      renderServicePriorityGroup('a'),
      renderServicePriorityGroup('b'),
      renderServicePriorityGroup('c'),
      renderServicePriorityGroup('abgeschlossen')
    ].filter(Boolean).join('') : `<div class="service-overview__empty"><div>Keine Serviceaufträge gefunden.</div><button class="btn btn--secondary" type="button" onclick="resetServiceOverviewFilters()">Filter zurücksetzen</button></div>`}` : renderServiceChecklistOverview()}
  `;
}

function viewServiceWorkspace(){
  const s = DATA.service.find(x=>x.id===state.serviceId);
  if(!s) return '<div class="empty">Serviceauftrag nicht gefunden.</div>';
  if(!state.view) state.view = 'Übersicht';
  return `
    <div class="ws-header">
      <div><div class="ws-title">Serviceauftrag ${s.nr}</div><div class="ws-subtitle">${s.titel} · ${s.kunde}</div></div>
      ${statusChip(s.status)}
    </div>
    <div class="tabs">
      ${SERVICE_VIEWS.map(v=>`<button type="button" class="tab ${state.view===v?'active':''}" ${state.view===v?'aria-current="page"':''} onclick="go('service',{serviceId:'${s.id}', view:'${v}'})">${getVisibleViewLabel(v)}</button>`).join('')}
    </div>
    <div>${renderServiceTab(s)}</div>
  `;
}

    case 'Übersicht': {
      const openChecklistCount = s.checkliste.length - done;

      const serviceHints = [];
      if(technicianLabel === 'Unbesetzt') serviceHints.push({tone:'amber',text:'Techniker noch nicht zugewiesen'});
      if(openChecklistCount) serviceHints.push({tone:'amber',text:`${openChecklistCount} Checklistenpunkte offen`});
      if(s.prioritaet === 'A') serviceHints.push({tone:'critical',text:'Priorität A – sofortige Bearbeitung'});
      if(s.material.length) serviceHints.push({tone:'neutral',text:`${s.material.length} Materialpositionen erfasst`});

        <div class="card__header">
          <h2 class="card__title" id="serviceHistoryTitle">Aktivitätsprotokoll</h2>

        ${renderTimeline(s.historie)}

   VIEW: MITARBEITER — Dokument 201 Kap. 23 (Unternehmensobjekt)
   ============================================================ */
function getEmployeeAssignment(employee){
  const reference = employee.zuordnung;
  if(!reference) return null;
  if(reference.typ === 'projekt'){
    const project = DATA.projekte.find(item=>item.id === reference.id);
    if(!project) return {typ:'projekt', missing:true};
    return {
      typ:'projekt', label:'Projekt', title:project.name, kunde:project.kunde, termin:project.termin,
      target:{area:'projekte', projectId:project.id, view:'Übersicht'}
    };
  }
  if(reference.typ === 'service'){
    const service = DATA.service.find(item=>item.id === reference.id);
    if(!service) return {typ:'service', missing:true};
    return {
      typ:'service', label:'Service', title:`Nr. ${service.nr} — ${service.titel}`, kunde:service.kunde, termin:service.termin,
      target:{area:'service', serviceId:service.id, view:'Übersicht'}
    };
  }
  return {typ:reference.typ, missing:true};
}

function getEmployeeAssignmentType(employee){
  return employee.zuordnung?.typ || 'none';
}

function getVisibleEmployees(){
  const query = employeeOverviewState.searchQuery.trim().toLocaleLowerCase('de');
  return DATA.mitarbeiter.filter(employee=>{
    const matchesQuery = !query || `${employee.name} ${employee.rolle}`.toLocaleLowerCase('de').includes(query);
    const matchesAvailability = employeeOverviewState.availabilityFilter === 'all' || employee.verfuegbarkeit === employeeOverviewState.availabilityFilter;
    const matchesAssignmentType = employeeOverviewState.assignmentTypeFilter === 'all' || getEmployeeAssignmentType(employee) === employeeOverviewState.assignmentTypeFilter;
    return matchesQuery && matchesAvailability && matchesAssignmentType;
  });
}

function getEmployeeOverviewCounts(){
  return DATA.mitarbeiter.reduce((counts, employee)=>{
    counts.total += 1;
    if(employee.verfuegbarkeit === 'eingesetzt') counts.assigned += 1;
    else if(employee.verfuegbarkeit === 'verfuegbar') counts.available += 1;
    else if(employee.verfuegbarkeit === 'abwesend') counts.absent += 1;
    return counts;
  }, {total:0, assigned:0, available:0, absent:0});
}

function groupEmployeesByAvailability(employees){
  return employees.reduce((groups, employee)=>{
    if(groups[employee.verfuegbarkeit]) groups[employee.verfuegbarkeit].push(employee);
    return groups;
  }, {eingesetzt:[], verfuegbar:[], abwesend:[]});
}

function renderEmployeeOverviewSummary(){
  const counts = getEmployeeOverviewCounts();
  return `<div class="employee-overview__summary" aria-label="Mitarbeiterübersicht">
    <div class="employee-overview__summary-item"><span class="employee-overview__summary-value">${counts.total}</span><span class="employee-overview__summary-label">Gesamt</span></div>
    <div class="employee-overview__summary-item"><span class="employee-overview__summary-value">${counts.assigned}</span><span class="employee-overview__summary-label">Im Einsatz</span></div>

function getEmployeeInitials(name){

}

  const availability = {

    verfuegbar:{label:'Verfügbar', className:'available'},
    abwesend:{label:'Abwesend', className:'absent'}
  }[employee.verfuegbarkeit] || {label:'Unbekannt', className:'absent'};
  const statusMarkup = `<span class="employee-overview__status employee-overview__status--${availability.className}">${availability.label}</span>${employee.bewegungsstatus === 'unterwegs' ? '<span class="employee-overview__status employee-overview__status--travel">Unterwegs</span>' : ''}`;

function renderEmployeeGroup(key, employees){
  if(!employees.length) return '';
  const labels = {eingesetzt:'Im Einsatz', verfuegbar:'Verfügbar', abwesend:'Abwesend'};
  const headingId = `employeeGroup-${key}`;
  return `<section class="employee-overview__group" aria-labelledby="${headingId}">
    <h2 id="${headingId}" class="employee-overview__group-title">${labels[key]} <span class="employee-overview__group-count">${employees.length}</span></h2>
    <div class="employee-overview__group-list">${employees.map(renderEmployeeRow).join('')}</div>
  </section>`;
}

function resetEmployeeOverviewFilters(){
  employeeOverviewState.searchQuery = '';
  employeeOverviewState.availabilityFilter = 'all';
  employeeOverviewState.assignmentTypeFilter = 'all';
  updateEmployeeOverview({focusId:'employeeOverviewSearch',caretToEnd:true});
}

function updateEmployeeOverview({focusId,caretToEnd=false}={}){
  const workspace = document.getElementById('workspace');
  if(!workspace || state.area !== 'mitarbeiter' || state.employeeId) return;
  workspace.innerHTML = viewMitarbeiter();
  bindEmployeeOverviewControls();
  const focusTarget = focusId ? document.getElementById(focusId) : null;
  if(focusTarget){
    focusTarget.focus({preventScroll:true});
    if(caretToEnd && typeof focusTarget.setSelectionRange === 'function'){
      const end = focusTarget.value.length;
      focusTarget.setSelectionRange(end,end);
    }
  }
}

function bindEmployeeOverviewControls(){
  const searchInput = document.getElementById('employeeOverviewSearch');
  const availabilitySelect = document.getElementById('employeeOverviewAvailability');
  const assignmentTypeSelect = document.getElementById('employeeOverviewAssignmentType');
  if(searchInput){
    searchInput.value = employeeOverviewState.searchQuery;
    searchInput.oninput = event=>{
      employeeOverviewState.searchQuery = event.target.value;
      updateEmployeeOverview({focusId:'employeeOverviewSearch',caretToEnd:true});
    };
  }
  if(availabilitySelect) availabilitySelect.onchange = event=>{
    employeeOverviewState.availabilityFilter = event.target.value;
    updateEmployeeOverview({focusId:'employeeOverviewAvailability'});
  };
  if(assignmentTypeSelect) assignmentTypeSelect.onchange = event=>{
    employeeOverviewState.assignmentTypeFilter = event.target.value;
    updateEmployeeOverview({focusId:'employeeOverviewAssignmentType'});
  };
}

function viewMitarbeiter(){
  const visibleEmployees = getVisibleEmployees();
  const groups = groupEmployeesByAvailability(visibleEmployees);
  return `
    <div class="ws-header"><div><div class="ws-title">Mitarbeiter</div><div class="ws-subtitle">Wer arbeitet aktuell woran und wer steht zur Verfügung?</div></div></div>

      renderEmployeeGroup('eingesetzt', groups.eingesetzt),
      renderEmployeeGroup('verfuegbar', groups.verfuegbar),
      renderEmployeeGroup('abwesend', groups.abwesend)
    ].join('') : '<div class="employee-overview__empty"><div>Keine Mitarbeiter entsprechen der aktuellen Suche oder Filterung.</div><button type="button" class="btn btn--secondary" onclick="resetEmployeeOverviewFilters()">Filter zurücksetzen</button></div>'}

}

function openEmployeeInCalendar(employeeId){
  const employee = DATA.mitarbeiter.find(item=>item.id === employeeId);

  calendarOverviewState.searchQuery = employee.name;
  calendarOverviewState.objectTypeFilter = 'all';
  calendarOverviewState.availabilityFilter = 'all';
  go('kalender');
}

function viewMitarbeiterWorkspace(){
  const employee = DATA.mitarbeiter.find(item=>item.id === state.employeeId);
  if(!employee) return '<div class="empty">Mitarbeiter nicht gefunden.</div>';

  const assignment = getEmployeeAssignment(employee);
  const availability = {
    eingesetzt:{label:'Im Einsatz', className:'assigned'},
    verfuegbar:{label:'Verfügbar', className:'available'},
    abwesend:{label:'Abwesend', className:'absent'}
  }[employee.verfuegbarkeit] || {label:'—', className:'absent'};
  const movementLabel = employee.bewegungsstatus === 'unterwegs' ? 'Unterwegs' : '—';
  const assignmentTypeLabel = assignment?.label
    || (assignment?.typ === 'projekt' ? 'Projekt' : assignment?.typ === 'service' ? 'Service' : '—');
  const assignmentAction = assignment?.target
    ? assignment.target.area === 'projekte'
      ? `go('projekte',{projectId:'${assignment.target.projectId}', view:'Übersicht'})`

  let assignmentMarkup = '<p class="employee-detail__empty">Keine aktuelle Zuordnung.</p>';
  if(assignment?.missing){
    assignmentMarkup = '<p class="employee-detail__empty">Zuordnung nicht gefunden.</p>';
  } else if(assignment){
    const dateLabel = assignment.typ === 'projekt' ? 'Projekttermin' : 'Service-Termin';
    assignmentMarkup = `<div class="employee-detail__assignment">
      <span class="employee-overview__assignment-type">${assignment.label}</span>
      <h3 class="employee-detail__assignment-title">${assignment.title}</h3>
      <div class="employee-detail__assignment-meta">${assignment.kunde || '—'}</div>
      <div class="employee-detail__assignment-meta">${dateLabel}: ${assignment.termin || '—'}</div>
      <button type="button" class="btn btn--secondary btn--s" onclick="${assignmentAction}">${assignmentButtonLabel}</button>
    </div>`;
  }

  const planningEntries = getPlanningEntriesForDate().filter(entry=>entry.resourceId === employee.id);
  const planningMarkup = planningEntries.length ? planningEntries.map(entry=>{
    const object = resolvePlanningObject(entry);
    const planningStatus = getCalendarPlanningStatus(entry);
    const objectLabel = object?.label || (entry.objectType === 'projekt' ? 'Projekt' : entry.objectType === 'service' ? 'Service' : 'Objekt');

        <div class="employee-detail__planning-meta">${object?.kunde || '—'}</div>
      </div>
      <div>
        <div class="employee-detail__planning-time"><time datetime="${entry.startAt || ''}">${formatPlanningTime(entry.startAt)}</time> – <time datetime="${entry.endAt || ''}">${formatPlanningTime(entry.endAt)}</time></div>
        <span class="calendar-overview__status calendar-overview__status--${planningStatus.className}">${planningStatus.label}</span>
      </div>
    </article>`;
  }).join('') : '<p class="employee-detail__empty">Für diesen Mitarbeiter ist am Referenzdatum kein Einsatz geplant.</p>';

  const directObjectButton = assignment?.target
    ? `<button type="button" class="btn btn--secondary" onclick="${assignmentAction}">${assignmentButtonLabel}</button>`
    : '';

  return `
    <div class="ws-header employee-detail__header">
      <div>
        <h1 class="ws-title employee-detail__title">${employee.name}</h1>
        <div class="ws-subtitle">${employee.rolle || '—'}</div>
      </div>
      <div class="employee-detail__header-statuses">
        <span class="employee-overview__status employee-overview__status--${availability.className}">${availability.label}</span>
        ${employee.bewegungsstatus === 'unterwegs' ? '<span class="employee-overview__status employee-overview__status--travel">Unterwegs</span>' : ''}
      </div>
    </div>
    <div class="grid grid-2 employee-detail__grid">
      <section class="card employee-detail__card" aria-labelledby="employeeDetailStatusTitle">
        <h2 id="employeeDetailStatusTitle" class="card__title employee-detail__title-secondary">Aktueller Status</h2>
        <dl class="employee-detail__facts">
          <div class="employee-detail__fact"><dt>Rolle</dt><dd>${employee.rolle || '—'}</dd></div>
          <div class="employee-detail__fact"><dt>Verfügbarkeit</dt><dd>${availability.label}</dd></div>
          <div class="employee-detail__fact"><dt>Bewegungsstatus</dt><dd>${movementLabel}</dd></div>
          <div class="employee-detail__fact"><dt>Bereich</dt><dd>${assignmentTypeLabel}</dd></div>

      <section class="card employee-detail__card" aria-labelledby="employeeDetailAssignmentTitle">

        ${assignmentMarkup}

   VIEW: KALENDER (global) — Dokument 202 Kap. 51

const CALENDAR_REFERENCE_DATE = '2026-07-10';
const CALENDAR_REFERENCE_LABEL = 'Freitag, 10. Juli 2026';
const CALENDAR_TIME_ZONE = 'Europe/Berlin';

function getPlanningEntriesForDate(date=CALENDAR_REFERENCE_DATE){
  return (DATA.planung || []).filter(entry=>entry.resourceType === 'employee' && typeof entry.startAt === 'string' && entry.startAt.slice(0,10) === date);
}
function getPlanningEntriesForObject(objectType,objectId){
  return getPlanningEntriesForDate().filter(entry=>entry.objectType === objectType && entry.objectId === objectId);
}

function resolvePlanningResource(planning){
  if(!planning || planning.resourceType !== 'employee') return null;
  return DATA.mitarbeiter.find(employee=>employee.id === planning.resourceId) || null;
}

function resolvePlanningObject(planning){
  if(!planning) return null;
  if(planning.objectType === 'projekt'){
    const project = DATA.projekte.find(item=>item.id === planning.objectId);
    if(!project) return null;
    return {type:'projekt', label:'Projekt', title:project.name, kunde:project.kunde, target:{area:'projekte', projectId:project.id, view:'Übersicht'}};
  }
  if(planning.objectType === 'service'){
    const service = DATA.service.find(item=>item.id === planning.objectId);
    if(!service) return null;
    return {type:'service', label:'Service', title:`Nr. ${service.nr} — ${service.titel}`, kunde:service.kunde, target:{area:'service', serviceId:service.id, view:'Übersicht'}};
  }
  return null;
}

function getCalendarPlanningForEmployee(employee){
  return getPlanningEntriesForDate().find(entry=>entry.resourceId === employee.id) || null;
}

function getVisibleCalendarEmployees(){
  const query = calendarOverviewState.searchQuery.trim().toLocaleLowerCase('de');
  return DATA.mitarbeiter.filter(employee=>{
    const planning = getCalendarPlanningForEmployee(employee);
    const object = resolvePlanningObject(planning);
    const searchable = [employee.name, employee.rolle, object?.title, object?.kunde].filter(Boolean).join(' ').toLocaleLowerCase('de');
    const matchesQuery = !query || searchable.includes(query);
    const matchesObjectType = calendarOverviewState.objectTypeFilter === 'all' || planning?.objectType === calendarOverviewState.objectTypeFilter;
    const availability = planning ? 'planned' : 'available';
    const matchesAvailability = calendarOverviewState.availabilityFilter === 'all' || availability === calendarOverviewState.availabilityFilter;
    return matchesQuery && matchesObjectType && matchesAvailability;
  });
}

function getUnassignedServiceItems(){
  return DATA.service.filter(service=>service.status !== 'Abgeschlossen' && (!service.techniker || service.techniker === '—'));
}

function getVisibleUnassignedServiceItems(){
  if(calendarOverviewState.objectTypeFilter === 'projekt') return [];
  const query = calendarOverviewState.searchQuery.trim().toLocaleLowerCase('de');
  return getUnassignedServiceItems().filter(service=>{
    const searchable = `${service.nr} ${service.titel} ${service.kunde} ${service.status} ${service.prioritaet}`.toLocaleLowerCase('de');
    return !query || searchable.includes(query);
  });
}

function getCalendarOverviewCounts(){
  const planningEntries = getPlanningEntriesForDate();
  const plannedEmployeeIds = new Set(planningEntries.map(entry=>entry.resourceId).filter(id=>DATA.mitarbeiter.some(employee=>employee.id === id)));
  return {
    total:DATA.mitarbeiter.length,
    planned:plannedEmployeeIds.size,
    available:DATA.mitarbeiter.filter(employee=>!plannedEmployeeIds.has(employee.id)).length,
    unassigned:getUnassignedServiceItems().length
  };
}

function formatPlanningTime(isoValue){
  if(typeof isoValue !== 'string') return '—';
  const date = new Date(isoValue);
  if(Number.isNaN(date.getTime())) return '—';
  return new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:CALENDAR_TIME_ZONE}).format(date);
}

function renderCalendarOverviewSummary(){
  const counts = getCalendarOverviewCounts();
  const hasNoSearch = !calendarOverviewState.searchQuery.trim();
  const totalActive = hasNoSearch && calendarOverviewState.objectTypeFilter === 'all' && calendarOverviewState.availabilityFilter === 'all';
  const plannedActive = hasNoSearch && calendarOverviewState.objectTypeFilter === 'all' && calendarOverviewState.availabilityFilter === 'planned';
  const availableActive = hasNoSearch && calendarOverviewState.objectTypeFilter === 'all' && calendarOverviewState.availabilityFilter === 'available';
  return `<div class="calendar-overview__summary" aria-label="Dispositionsübersicht">
    <button type="button" class="calendar-overview__summary-item ${totalActive?'active':''}" onclick="applyCalendarOverviewSummaryAction('all')" aria-label="Alle Mitarbeiter anzeigen" aria-pressed="${totalActive}"><span class="calendar-overview__summary-value">${counts.total}</span><span class="calendar-overview__summary-label">Mitarbeiter gesamt</span></button>
    <button type="button" class="calendar-overview__summary-item ${plannedActive?'active':''}" onclick="applyCalendarOverviewSummaryAction('planned')" aria-label="Heute eingeplante Mitarbeiter anzeigen" aria-pressed="${plannedActive}"><span class="calendar-overview__summary-value">${counts.planned}</span><span class="calendar-overview__summary-label">Heute eingeplant</span></button>
    <button type="button" class="calendar-overview__summary-item ${availableActive?'active':''}" onclick="applyCalendarOverviewSummaryAction('available')" aria-label="Verfügbare Mitarbeiter anzeigen" aria-pressed="${availableActive}"><span class="calendar-overview__summary-value">${counts.available}</span><span class="calendar-overview__summary-label">Verfügbar</span></button>
    <button type="button" class="calendar-overview__summary-item" onclick="applyCalendarOverviewSummaryAction('unassigned')" aria-label="Zu unbesetzten Serviceeinsätzen springen"><span class="calendar-overview__summary-value">${counts.unassigned}</span><span class="calendar-overview__summary-label">Service unbesetzt</span></button>
  </div>`;
}

function renderCalendarOverviewToolbar(){
  return `<div class="calendar-overview__toolbar">
    <label class="calendar-overview__field calendar-overview__field--search" for="calendarOverviewSearch">
      <span class="calendar-overview__field-label">Suche</span>
      <input id="calendarOverviewSearch" type="search" placeholder="Mitarbeiter, Objekt, Auftrag oder Kunde" autocomplete="off">
    </label>
    <label class="calendar-overview__field" for="calendarOverviewObjectType">
      <span class="calendar-overview__field-label">Objekttyp</span>
      <select id="calendarOverviewObjectType">
        <option value="all" ${calendarOverviewState.objectTypeFilter === 'all' ? 'selected' : ''}>Alle</option>
        <option value="projekt" ${calendarOverviewState.objectTypeFilter === 'projekt' ? 'selected' : ''}>Projekte</option>
        <option value="service" ${calendarOverviewState.objectTypeFilter === 'service' ? 'selected' : ''}>Service</option>
      </select>
    </label>
    <label class="calendar-overview__field" for="calendarOverviewAvailability">
      <span class="calendar-overview__field-label">Verfügbarkeit</span>
      <select id="calendarOverviewAvailability">
        <option value="all" ${calendarOverviewState.availabilityFilter === 'all' ? 'selected' : ''}>Alle Mitarbeiter</option>
        <option value="planned" ${calendarOverviewState.availabilityFilter === 'planned' ? 'selected' : ''}>Eingeplant</option>
        <option value="available" ${calendarOverviewState.availabilityFilter === 'available' ? 'selected' : ''}>Verfügbar</option>
      </select>
    </label>
  </div>`;
}

function getCalendarEmployeeInitials(name){
  return name.split(/\s+/).filter(Boolean).map(part=>part[0]).slice(0,2).join('').toLocaleUpperCase('de');
}

function getCalendarPlanningStatus(planning){
  const statusMap = {
    aktiv:{label:'Aktiv', className:'active'},
    geplant:{label:'Geplant', className:'planned'},
    abgeschlossen:{label:'Abgeschlossen', className:'completed'}
  };
  return statusMap[planning?.status] || {label:'Eingeplant', className:'planned'};
}

function renderCalendarResourceRow(employee){
  const planning = getCalendarPlanningForEmployee(employee);
  const object = resolvePlanningObject(planning);
  const identity = `<div class="calendar-overview__identity"><span class="calendar-overview__avatar" aria-hidden="true">${getCalendarEmployeeInitials(employee.name)}</span><span class="calendar-overview__person"><span class="calendar-overview__name">${employee.name}</span><span class="calendar-overview__role">${employee.rolle}</span></span></div>`;
  if(!planning){
    return `<article class="calendar-overview__resource-row">${identity}<div class="calendar-overview__statuses"><span class="calendar-overview__status calendar-overview__status--available">Verfügbar</span></div><div class="calendar-overview__object"><span class="calendar-overview__available-copy">Kein Planungseintrag für das Referenzdatum</span></div><div class="calendar-overview__time">—</div></article>`;
  }
  const planningStatus = getCalendarPlanningStatus(planning);
  const statuses = `<div class="calendar-overview__statuses"><span class="calendar-overview__status calendar-overview__status--${planningStatus.className}">${planningStatus.label}</span>${employee.bewegungsstatus === 'unterwegs' ? '<span class="calendar-overview__status calendar-overview__status--travel">Unterwegs</span>' : ''}</div>`;
  const time = `<div class="calendar-overview__time"><time datetime="${planning.startAt}">${formatPlanningTime(planning.startAt)}</time>–<time datetime="${planning.endAt}">${formatPlanningTime(planning.endAt)}</time></div>`;
  if(!object){
    return `<article class="calendar-overview__resource-row">${identity}${statuses}<div class="calendar-overview__object"><span class="calendar-overview__warning">Planungsreferenz nicht gefunden</span></div>${time}</article>`;
  }
  const action = object.target.area === 'projekte'
    ? `go('projekte',{projectId:'${object.target.projectId}', view:'Übersicht'})`
    : `go('service',{serviceId:'${object.target.serviceId}', view:'Übersicht'})`;
  const objectMarkup = `<div class="calendar-overview__object"><button type="button" class="calendar-overview__object-action" onclick="${action}" aria-label="${employee.name}: ${object.label} ${object.title} öffnen"><span class="calendar-overview__object-head"><span class="calendar-overview__badge calendar-overview__badge--${object.type}">${object.label}</span><span class="calendar-overview__object-title">${object.title}</span></span><span class="calendar-overview__object-meta">${object.kunde}</span></button></div>`;
  return `<article class="calendar-overview__resource-row">${identity}${statuses}${objectMarkup}${time}</article>`;
}

function renderCalendarReferenceWarnings(){
  const invalidEntries = getPlanningEntriesForDate().filter(entry=>!resolvePlanningResource(entry));
  if(!invalidEntries.length) return '';
  return `<div class="calendar-overview__reference-warnings" aria-label="Planungswarnungen">${invalidEntries.map(()=>'<div class="calendar-overview__warning">Planungsreferenz nicht gefunden</div>').join('')}</div>`;
}

function renderUnassignedServiceSection(){
  const allItems = getUnassignedServiceItems();
  const items = getVisibleUnassignedServiceItems();
  let content = '';
  if(!allItems.length){
    content = '<div class="calendar-overview__compact-empty">Alle aktuellen Serviceeinsätze sind besetzt.</div>';
  } else if(!items.length){
    content = '<div class="calendar-overview__compact-empty">Keine unbesetzten Serviceeinsätze entsprechen der aktuellen Suche oder Filterung.</div>';
  } else {
    content = `<div class="calendar-overview__unassigned-list">${items.map(service=>{
      const priority = ['A','B','C'].includes(service.prioritaet) ? service.prioritaet : 'C';
