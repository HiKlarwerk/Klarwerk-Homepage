/* ============================================================
   VIEW: DOKUMENTE (global, Unternehmensebene) — Dok. 201 Kap. 24
   Abgeleitete Sicht auf DATA.projekte[*].dokumente / DATA.service[*].dokumente.
   Keine eigene Dokument-Datenhaltung — nur Lesezugriff + Filterung.
   ============================================================ */
function formatDocumentField(value, prefix=''){
  if(!value || value === '—') return '—';
  return prefix + value;
}

function getAllDocuments(){
  const ausProjekten = DATA.projekte.flatMap(p => (p.dokumente||[]).map(d => ({
    ...d, bereich:'projekt', objectId:p.id, objectLabel:p.name,
    target:{area:'projekte', projectId:p.id, view:'Dokumente'}
  })));
  const ausService = DATA.service.flatMap(s => (s.dokumente||[]).map(d => ({
    ...d, bereich:'service', objectId:s.id, objectLabel:`Auftrag ${s.nr} — ${s.titel}`,
    target:{area:'service', serviceId:s.id, view:'Dokumente'}
  })));
  return [...ausProjekten, ...ausService];
}

function getDocumentEffectiveType(d){
  if(d.typ) return d.typ;
  if(d.extension) return String(d.extension).toUpperCase();
  return '—';
}

function getDocumentTypes(){
  const typen = new Set(getAllDocuments().map(getDocumentEffectiveType).filter(t=>t && t!=='—'));
  return Array.from(typen).sort((a,b)=>a.localeCompare(b,'de'));
}

function getDocumentOverviewCounts(){
  const alle = getAllDocuments();
  return {
    total: alle.length,
    projekte: alle.filter(d=>d.bereich==='projekt').length,
    service: alle.filter(d=>d.bereich==='service').length
  };
}

function getVisibleDocuments(){
  const query = documentOverviewState.searchQuery.trim().toLocaleLowerCase('de');
  return getAllDocuments().filter(d=>{
    const matchesQuery = !query || `${d.name} ${d.objectLabel}`.toLocaleLowerCase('de').includes(query);
    const matchesArea = documentOverviewState.areaFilter === 'all' || d.bereich === documentOverviewState.areaFilter;
    const matchesType = documentOverviewState.typeFilter === 'all' || getDocumentEffectiveType(d) === documentOverviewState.typeFilter;
    return matchesQuery && matchesArea && matchesType;
  });
}

function groupDocumentsByObject(documents){
  const reihenfolge = [];
  const groups = new Map();
  documents.forEach(d=>{
    const key = d.bereich+':'+d.objectId;
    if(!groups.has(key)){
      groups.set(key, {bereich:d.bereich, objectId:d.objectId, objectLabel:d.objectLabel, target:d.target, documents:[]});
      reihenfolge.push(key);
    }
    groups.get(key).documents.push(d);
  });
  return reihenfolge.map(key=>groups.get(key));
}

function documentObjectAction(target){
  return target.area==='projekte'
    ? `go('projekte',{projectId:'${target.projectId}', view:'Dokumente'})`
    : `go('service',{serviceId:'${target.serviceId}', view:'Dokumente'})`;
}

function renderDocumentOverviewSummary(){
  const counts = getDocumentOverviewCounts();
  return `<div class="document-overview__summary" aria-label="Dokumentenübersicht">
    <div class="document-overview__summary-item"><span class="document-overview__summary-value">${counts.total}</span><span class="document-overview__summary-label">Dokumente gesamt</span></div>
    <div class="document-overview__summary-item"><span class="document-overview__summary-value">${counts.projekte}</span><span class="document-overview__summary-label">aus Projekten</span></div>
    <div class="document-overview__summary-item"><span class="document-overview__summary-value">${counts.service}</span><span class="document-overview__summary-label">aus Service</span></div>
  </div>`;
}

function renderDocumentOverviewToolbar(){
  const typen = getDocumentTypes();
  return `<div class="document-overview__toolbar">
    <label class="document-overview__field document-overview__field--search" for="documentOverviewSearch">
      <span class="document-overview__field-label">Suche</span>
      <input id="documentOverviewSearch" type="search" placeholder="Dokumentname oder Objekt" autocomplete="off">
    </label>
    <label class="document-overview__field" for="documentOverviewArea">
      <span class="document-overview__field-label">Bereich</span>
      <select id="documentOverviewArea">
        <option value="all" ${documentOverviewState.areaFilter==='all'?'selected':''}>Alle</option>
        <option value="projekt" ${documentOverviewState.areaFilter==='projekt'?'selected':''}>Projekte</option>
        <option value="service" ${documentOverviewState.areaFilter==='service'?'selected':''}>Service</option>
      </select>
    </label>
    <label class="document-overview__field" for="documentOverviewType">
      <span class="document-overview__field-label">Dateityp</span>
      <select id="documentOverviewType">
        <option value="all" ${documentOverviewState.typeFilter==='all'?'selected':''}>Alle Typen</option>
        ${typen.map(t=>`<option value="${t}" ${documentOverviewState.typeFilter===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </label>
  </div>`;
}

function renderDocumentRow(d){
  const action = documentObjectAction(d.target);
  const bereichLabel = d.bereich==='projekt' ? 'Projekt' : 'Service';
  const chipClass = d.bereich==='projekt' ? 'chip--info' : 'chip--neutral';
  const meta = [d.objectLabel, formatDocumentField(getDocumentEffectiveType(d)), formatDocumentField(d.version,'v'), formatDocumentField(d.groesse)].join(' · ');
  const openAction = d.openUrl ? `<a class="btn btn--secondary btn--s" href="${d.openUrl}" target="_blank" rel="noopener">Öffnen ↗</a>` : '';
  return `<div class="list-item">
    <button type="button" class="document-overview__row-action" onclick="${action}" aria-label="${d.name}, ${bereichLabel} ${d.objectLabel} öffnen">
      <span class="list-item__main">
        <span class="list-item__title">📄 ${d.name} <span class="chip ${chipClass}">${bereichLabel}</span></span>
        <span class="list-item__meta">${meta}</span>
      </span>
    </button>
    ${openAction}
  </div>`;
}

function renderDocumentGroup(group){
  const bereichLabel = group.bereich==='projekt' ? 'Projekt' : 'Service';
  const chipClass = group.bereich==='projekt' ? 'chip--info' : 'chip--neutral';
  const action = documentObjectAction(group.target);
  return `<div class="card">
      <button type="button" class="document-overview__group-header" onclick="${action}" aria-label="${group.objectLabel} öffnen">
        <span class="document-overview__group-title">${group.objectLabel} <span class="chip ${chipClass}">${bereichLabel}</span></span>
        <span class="document-overview__group-count">${group.documents.length} Dokument${group.documents.length===1?'':'e'}</span>
      </button>
      <div class="list">${group.documents.map(renderDocumentRow).join('')}</div>
    </div>`;
}

function resetDocumentOverviewFilters(){
  documentOverviewState.searchQuery = '';
  documentOverviewState.areaFilter = 'all';
  documentOverviewState.typeFilter = 'all';
  render();
}

function updateDocumentOverview(){
  const workspace = document.getElementById('workspace');
  if(workspace) workspace.innerHTML = viewDokumenteGlobal();
  bindDocumentOverviewControls();
}

function bindDocumentOverviewControls(){
  const searchInput = document.getElementById('documentOverviewSearch');
  const areaSelect = document.getElementById('documentOverviewArea');
  const typeSelect = document.getElementById('documentOverviewType');
  if(searchInput){
    searchInput.value = documentOverviewState.searchQuery;
    searchInput.oninput = event=>{
      documentOverviewState.searchQuery = event.target.value;
      updateDocumentOverview();
      const nextInput = document.getElementById('documentOverviewSearch');
      if(nextInput){ nextInput.focus(); nextInput.setSelectionRange(nextInput.value.length, nextInput.value.length); }
    };
  }
  if(areaSelect) areaSelect.onchange = event=>{ documentOverviewState.areaFilter = event.target.value; updateDocumentOverview(); };
  if(typeSelect) typeSelect.onchange = event=>{ documentOverviewState.typeFilter = event.target.value; updateDocumentOverview(); };
}

function viewDokumenteGlobal(){
  const alleDokumente = getAllDocuments();
  const sichtbareDokumente = getVisibleDocuments();
  const gruppen = groupDocumentsByObject(sichtbareDokumente);
  return `
    <div class="ws-header"><div><div class="ws-title">Dokumente</div><div class="ws-subtitle">Unternehmensweite Dokumentenübersicht nach Projekt und Service</div></div></div>
    ${renderDocumentOverviewSummary()}
    ${renderDocumentOverviewToolbar()}
    <div class="document-overview__result-count" role="status" aria-live="polite">${sichtbareDokumente.length} von ${alleDokumente.length} Dokumenten angezeigt</div>
    ${gruppen.length ? `<div class="document-overview__groups">${gruppen.map(renderDocumentGroup).join('')}</div>` : '<div class="document-overview__empty"><div>Keine Dokumente entsprechen der aktuellen Suche oder Filterung.</div><button type="button" class="btn btn--secondary" onclick="resetDocumentOverviewFilters()">Filter zurücksetzen</button></div>'}
  `;
}

/* ============================================================
   VIEW: MATERIAL (global, rein operative Leseansicht)
   Abgeleitete Sicht auf DATA.projekte[*].material / DATA.service[*].material.
   ============================================================ */
function getAllMaterialPositions(){
  const projectPositions = DATA.projekte.flatMap((project,objectIndex)=>
    (project.material || []).map((material,materialIndex)=>({
      bereich:'projekt',
      objekt:project,
      material,
      objectIndex,
      materialIndex,
      target:{area:'projekte', projectId:project.id, view:'Material'}
    }))
  );
  const servicePositions = DATA.service.flatMap((service,objectIndex)=>
    (service.material || []).map((material,materialIndex)=>({
      bereich:'service',
      objekt:service,
      material,
      objectIndex,
      materialIndex,
      target:{area:'service', serviceId:service.id, view:'Material'}
    }))
  );
  return [...projectPositions, ...servicePositions];
}

function getVisibleMaterialPositions(){
  const query = materialOverviewState.searchQuery.trim().toLocaleLowerCase('de');
  return getAllMaterialPositions().filter(position=>{
    const {bereich,objekt,material} = position;
    const searchable = bereich === 'projekt'
      ? `${material.artikel} ${objekt.name} ${objekt.kunde}`
      : `${material.artikel} ${objekt.nr} ${objekt.titel} ${objekt.kunde}`;
    const matchesQuery = !query || searchable.toLocaleLowerCase('de').includes(query);
    const matchesArea = materialOverviewState.areaFilter === 'all' || bereich === materialOverviewState.areaFilter;
    const matchesStatus = materialOverviewState.statusFilter === 'all' || material.status === materialOverviewState.statusFilter;
    return matchesQuery && matchesArea && matchesStatus;
  });
}

function getMaterialGlobalOverviewStats(){
  const positions = getAllMaterialPositions();
  return {
    total:positions.length,
    projects:positions.filter(position=>position.bereich === 'projekt').length,
    service:positions.filter(position=>position.bereich === 'service').length,
    procurement:positions.filter(({material})=>material.status === 'Bestellt' || material.status === 'Anfrage offen').length
  };
}

function resetMaterialOverviewFilters(){
  materialOverviewState.searchQuery = '';
  materialOverviewState.areaFilter = 'all';
  materialOverviewState.statusFilter = 'all';
  updateMaterialOverview({focusId:'materialOverviewSearch',caretToEnd:true});
}

function materialPositionAction(position){
  return position.bereich === 'projekt'
    ? `go('projekte',{projectId:'${position.target.projectId}', view:'Material'})`
    : `go('service',{serviceId:'${position.target.serviceId}', view:'Material'})`;
}

}

function renderMaterialGlobalRow(position){
  const {bereich,objekt,material} = position;
  const isProject = bereich === 'projekt';
  const areaLabel = isProject ? 'Projekt' : 'Service';
  const objectLabel = isProject ? objekt.name : `${objekt.nr} · ${objekt.titel}`;

function bindMaterialOverviewControls(){

    materialOverviewState.statusFilter = event.target.value;

function viewMaterialGlobal(){
  const allPositions = getAllMaterialPositions();
  const visiblePositions = getVisibleMaterialPositions();
  return `

  `;
}

          <div class="field">
            <label for="settingsWorkingHours">Standard-Arbeitszeit</label>
            <input id="settingsWorkingHours" type="text" value="07:00 – 17:00">
          </div>
          <p class="settings-admin-note">Unternehmensweite Einstellungen können in einer späteren produktiven Ausbaustufe administrativen Rollen vorbehalten sein.</p>
        </section>
        <section class="card settings-card" aria-labelledby="settingsSystemTitle">
          <h2 class="card__title settings-section__title" id="settingsSystemTitle">System</h2>
          <dl class="settings-info">
            <div class="settings-info__row"><dt>Modus</dt><dd>Demonstrator</dd></div>
            <div class="settings-info__row"><dt>Datenquelle</dt><dd>${runtime.source === 'server' ? 'Firmenserver' : 'Demo'}</dd></div>
            <div class="settings-info__row"><dt>API-Basis</dt><dd>${runtime.apiBase}</dd></div>
            <div class="settings-info__row"><dt>Produktive Speicherung</dt><dd>Nicht aktiv</dd></div>
          </dl>
          <p class="settings-admin-note">Die Systeminformationen sind lesend; produktive Speicherung ist nicht aktiv.</p>
        </section>
      </div>
      <div class="settings-actions">
        <button type="submit" class="btn btn--primary">Änderungen übernehmen</button>
      </div>
    </form>
  `;
}

async function fetchJson(url){
  const response=await fetch(url,{headers:{Accept:'application/json'}});
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}

function normalizeServerProject(project,documents){
  return {
    ...project,
    aufgaben:[], dokumente:documents||[], material:[], team:[], chat:[], historie:[],
    fortschritt:Number(project.fortschritt)||0,
    status:project.status||'Importiert', kunde:project.kunde||'Aus Ordnerstruktur',
    verantwortlich:project.verantwortlich||'Nicht zugeordnet', termin:project.termin||'–'
  };
}

async function initializeApp(){
  render();
  try{
    const projects=await fetchJson(`${runtime.apiBase}/projects`);
    const hydrated=await Promise.all(projects.map(async project=>{
      const documents=await fetchJson(`${runtime.apiBase}/projects/${encodeURIComponent(project.id)}/documents`);
      return normalizeServerProject(project,documents);
    }));
    DATA.projekte=hydrated;
    runtime.source='server';
    document.getElementById('statusRight').textContent=`Firmenserver · ${projects.length} Projekte indiziert`;
    render();
  }catch(error){
    runtime.source='demo';
    document.getElementById('statusRight').textContent='Demodaten · Server nicht verbunden';
  }
}

/* Init */
initializeApp();
</script>
</body>
